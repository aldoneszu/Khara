<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع تحفيظ القرآن الذكي</title>
<style>
  body { background: #111; color: #eee; font-family: 'Cairo', sans-serif; padding: 20px; }
  .sura-btn { background: #222; color: #0f0; padding: 10px; margin: 5px; border-radius: 5px; display: inline-block; cursor: pointer; }
  .ayah { border: 1px solid #333; padding: 10px; margin: 10px 0; border-radius: 5px; }
  .memorized { color: #00ff99; }
  button { margin-top: 5px; }
</style>
</head>
<body>

<h1>📖 تحفيظ القرآن الكريم - خطة ذكية 📖</h1>
<div id="suraList"></div>
<div id="ayahs"></div>

<script>
const suraNames = [
  "", "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة",
  "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم",
  "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت",
  "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر",
  "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات",
  "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر",
  "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة",
  "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات",
  "عبس", "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر",
  "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة",
  "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون",
  "النصر", "المسد", "الإخلاص", "الفلق", "الناس"
];

// عرض الأزرار
for (let i = 1; i <= 114; i++) {
  const btn = document.createElement('button');
  btn.className = 'sura-btn';
  btn.innerText = suraNames[i];
  btn.onclick = () => loadSura(i);
  document.getElementById('suraList').appendChild(btn);
}

async function loadSura(sura) {
  const res = await fetch(`https://api.quran.gading.dev/surah/${sura}`);
  const data = await res.json();
  document.getElementById('ayahs').innerHTML = `<h2>${suraNames[sura]}</h2>`;
  data.data.ayahs.forEach(ayah => {
    const div = document.createElement('div');
    div.className = 'ayah';
    const isMem = localStorage.getItem(`mem_${sura}_${ayah.number.inSurah}`) ? 'memorized' : '';
    div.innerHTML = `
      <p class="${isMem}">${ayah.text.ar}</p>
      <audio controls src="https://cdn.islamic.network/quran/audio/128/ar.alafasy/${ayah.number.inQuran}.mp3"></audio><br>
      <button onclick="markMemorized(${sura},${ayah.number.inSurah},this)">✔️ حفظت هذه الآية</button>
    `;
    document.getElementById('ayahs').appendChild(div);
  });
}

function markMemorized(sura, ayah, btn) {
  localStorage.setItem(`mem_${sura}_${ayah}`, true);
  btn.parentElement.querySelector('p').classList.add('memorized');
}
</script>

</body>
</html>
